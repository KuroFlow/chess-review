<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessReview — Stop Repeating Blunders</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root {
    --bg0: #0a0a12;
    --bg1: #12121e;
    --bg2: #1c1c2b;
    --bg3: #27273a;
    --accent: #6366f1;
    --accent2: #4f46e5;
    --text: #f1f1fb;
    --text2: #b8b8dd;
    --text3: #7777aa;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: var(--bg0);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */
.hdr {
    height: 70px;
    background: var(--bg1);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 18px;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
}

.logo em { color: var(--accent); }

/* LANDING */
#landing {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 20%, rgba(99,102,241,0.18), transparent 65%), var(--bg0);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.ld-card {
    background: rgba(18,18,32,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 28px;
    padding: 60px 50px;
    max-width: 640px;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,0.7);
}

/* MAIN LAYOUT */
.page {
    display: flex;
    height: calc(100vh - 70px);
}

.center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    padding: 20px;
    background: var(--bg0);
}

/* BOARD */
.board-grid {
    display: grid;
    grid-template-columns: repeat(8, 72px);
    grid-template-rows: repeat(8, 72px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(0,0,0,0.85),
                inset 0 0 0 1px rgba(255,255,255,0.12);
}

.sq {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: all 0.15s ease;
}

.sq.li { background: #f0d9b5; }
.sq.dk { background: #b58863; }

.piece {
    font-size: 54px;
    transition: transform 0.25s ease;
    z-index: 3;
}

.sq:hover .piece { transform: scale(1.12); }

/* Legal Moves */
.legal-dot {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(80, 220, 120, 0.55);
    border-radius: 50%;
    z-index: 5;
}

.legal-capture {
    position: absolute;
    inset: 8px;
    border: 5px solid rgba(255, 70, 70, 0.75);
    border-radius: 50%;
    z-index: 5;
}

/* Eval Bar */
.ev-bar-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.ev-num {
    font-family: 'Inconsolata', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--text2);
}

.ev-bar {
    width: 22px;
    height: 580px;
    background: #1f1f2e;
    border-radius: 9999px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
}

.ev-fill {
    width: 100%;
    background: linear-gradient(to top, #a5b4fc, #6366f1);
    transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Right Panel */
.rpanel {
    width: 320px;
    background: var(--bg1);
    border-left: 1px solid rgba(255,255,255,0.08);
    padding: 20px;
    overflow-y: auto;
}

.pgn-ta {
    width: 100%;
    background: var(--bg2);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    color: var(--text2);
    font-family: 'Inconsolata', monospace;
    padding: 12px;
    resize: vertical;
    min-height: 100px;
}

.nav-row {
    display: flex;
    gap: 8px;
    margin: 15px 0;
    justify-content: center;
}

.nav-btn {
    padding: 8px 14px;
    background: var(--bg2);
    border: none;
    border-radius: 10px;
    color: var(--text2);
    cursor: pointer;
}

.mv-list {
    font-family: 'Inconsolata', monospace;
    font-size: 14.5px;
    line-height: 1.6;
    margin-top: 10px;
}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
    <div class="ld-card">
        <div style="font-size:34px;margin-bottom:24px;">◈ ChessReview</div>
        <h1 style="font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-2.5px;margin-bottom:20px;">
            Stop losing to<br><em>your own mistakes</em>
        </h1>
        <p style="font-size:19px;color:var(--text2);margin-bottom:30px;">
            Paste your PGN and get a beautiful, professional analysis.
        </p>
        <button onclick="startFromLanding()" style="width:100%;padding:18px;font-size:18px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;border:none;border-radius:16px;font-weight:700;">
            Analyze My Game — Free
        </button>
    </div>
</div>

<div class="page">
    <!-- LEFT SIDEBAR -->
    <div style="width:280px;background:var(--bg1);border-right:1px solid rgba(255,255,255,0.08);padding:20px;overflow-y:auto;">
        <div style="margin-bottom:20px;">
            <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text3);margin-bottom:8px;">YOUR PGN</div>
            <textarea id="pgn-input" class="pgn-ta" placeholder="Paste your game PGN here..."></textarea>
        </div>
        <button onclick="doAnalyze()" style="width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:12px;font-weight:600;">
            Analyze with Stockfish
        </button>
    </div>

    <!-- CENTER BOARD -->
    <div class="center">
        <div class="ev-bar-container">
            <div id="ev-num">+0.00</div>
            <div class="ev-bar">
                <div class="ev-fill" id="ev-fill" style="height:52%;"></div>
            </div>
        </div>

        <div id="board-container">
            <div class="board-grid" id="board-grid"></div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="rpanel">
        <h3 style="margin-bottom:15px;color:var(--accent);">Analysis</h3>
        
        <div class="nav-row">
            <button class="nav-btn" onclick="prevMove()">← Prev</button>
            <button class="nav-btn" onclick="gotoStart()">Start</button>
            <button class="nav-btn" onclick="nextMove()">Next →</button>
        </div>

        <div id="move-list" class="mv-list"></div>
    </div>
</div>

<script>
// ==================== GLOBALS ====================
let chess = new Chess();
let flipped = false;
let selectedSquare = null;
let legalMoves = [];
let moveHistory = [];
let currentMoveIndex = 0;

// ==================== RENDER BOARD ====================
function renderBoard() {
    const grid = document.getElementById('board-grid');
    grid.innerHTML = '';

    const board = chess.board();
    const ranks = flipped ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
    const files = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

    for (let r of ranks) {
        for (let c of files) {
            const square = String.fromCharCode(97 + c) + (r + 1);
            const isLight = (r + c) % 2 === 0;

            const sqEl = document.createElement('div');
            sqEl.className = `sq ${isLight ? 'li' : 'dk'}`;
            sqEl.dataset.square = square;

            const piece = board[7 - r][c];
            if (piece) {
                const pEl = document.createElement('div');
                pEl.className = 'piece';
                pEl.innerHTML = getPieceSymbol(piece.color, piece.type);
                sqEl.appendChild(pEl);
            }

            if (legalMoves.includes(square)) {
                const indicator = document.createElement('div');
                indicator.className = piece ? 'legal-capture' : 'legal-dot';
                sqEl.appendChild(indicator);
            }

            sqEl.addEventListener('click', () => handleSquareClick(square));
            grid.appendChild(sqEl);
        }
    }
}

function getPieceSymbol(color, type) {
    const map = {
        'w': { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
        'b': { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
    };
    return map[color][type];
}

// ==================== MOVE LOGIC ====================
function handleSquareClick(square) {
    if (selectedSquare) {
        const move = chess.move({ from: selectedSquare, to: square, promotion: 'q' });
        if (move) {
            moveHistory = chess.history();
            currentMoveIndex = moveHistory.length;
            renderBoard();
            updateMoveList();
            selectedSquare = null;
            legalMoves = [];
            return;
        }
    }

    const piece = chess.get(square);
    if (piece && piece.color === chess.turn()) {
        selectedSquare = square;
        legalMoves = chess.moves({ square: square, verbose: true }).map(m => m.to);
        renderBoard();
    } else {
        selectedSquare = null;
        legalMoves = [];
        renderBoard();
    }
}

function updateMoveList() {
    const container = document.getElementById('move-list');
    let html = '<strong>Moves:</strong><br>';
    moveHistory.forEach((move, i) => {
        if (i % 2 === 0) html += `${Math.floor(i/2)+1}. `;
        html += `${move} `;
    });
    container.innerHTML = html;
}

// Navigation
function prevMove() {
    if (currentMoveIndex > 0) {
        currentMoveIndex--;
        chess.undo();
        renderBoard();
        updateMoveList();
    }
}

function nextMove() {
    alert("Próxima jugada - Se expandirá en la siguiente fase con Stockfish");
}

function gotoStart() {
    chess.reset();
    moveHistory = [];
    currentMoveIndex = 0;
    renderBoard();
    updateMoveList();
}

// Analyze
function doAnalyze() {
    const pgn = document.getElementById('pgn-input').value.trim();
    if (!pgn) {
        alert("Por favor pega una partida PGN en el panel izquierdo.");
        return;
    }
    alert("Analizando partida con Stockfish...\n\n(En la siguiente fase implementaremos el análisis real)");
    // Aquí iría la lógica completa de análisis
}

function startFromLanding() {
    document.getElementById('landing').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('landing').style.display = 'none';
        renderBoard();
    }, 600);
}

// Flip
function doFlip() {
    flipped = !flipped;
    renderBoard();
}

// Keyboard
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') prevMove();
    if (e.key === 'ArrowRight') nextMove();
});

// Init
window.onload = () => {
    console.log("%cChessReview — Fase 6 completa (PGN restaurado + Tablero funcional)", "color:#6366f1; font-weight:bold");
};
</script>

</body>
</html>
