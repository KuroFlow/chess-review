<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessReview — Stop Repeating Blunders</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root {
    --bg0: #09090f;
    --bg1: #111118;
    --bg2: #1a1a24;
    --bg3: #242430;
    --accent: #6366f1;
    --accent-dark: #4f46e5;
    --text: #f0f0fa;
    --text2: #b8b8d8;
    --text3: #7a7aa0;
    --success: #22c55e;
    --danger: #ef4444;

    --sq-l: #f0d9b5;
    --sq-d: #b58863;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg0);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */
.hdr {
    height: 68px;
    background: var(--bg1);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.6px;
}

.logo em {
    color: var(--accent);
    font-style: normal;
}

.mode-toggle {
    display: flex;
    background: var(--bg2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9999px;
    padding: 4px;
}

.mode-btn {
    padding: 9px 22px;
    border-radius: 9999px;
    font-size: 14.5px;
    font-weight: 600;
    transition: all 0.25s ease;
}

.mode-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}

/* LANDING MEJORADA */
#landing {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 25%, rgba(99,102,241,0.16), transparent 70%),
                var(--bg0);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.6s ease;
}

.ld-card {
    background: rgba(17, 17, 27, 0.96);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 28px;
    padding: 56px 48px;
    max-width: 620px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
}

.ld-h {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -3px;
    margin-bottom: 20px;
}

.ld-h em {
    background: linear-gradient(90deg, #6366f1, #a855f7, #db2777);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.ld-sub {
    font-size: 18.5px;
    color: var(--text2);
    margin-bottom: 40px;
    line-height: 1.4;
}

/* Board */
.board-grid {
    display: grid;
    grid-template-columns: repeat(8, 70px);
    grid-template-rows: repeat(8, 70px);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.75),
                inset 0 0 0 1px rgba(255,255,255,0.1);
}

/* Botones principales */
.sbtn-main, .ld-btn-main {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
}

.sbtn-main:hover, .ld-btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(99, 102, 241, 0.35);
}

/* Utilidades */
.slbl {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
}
</style>
</head>
<body>

<!-- LANDING PAGE MEJORADA -->
<div id="landing">
    <div class="ld-card">
        <div class="logo" style="justify-content:center; font-size:32px; margin-bottom:32px;">
            ◈ <span style="background: linear-gradient(90deg, #6366f1, #a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">ChessReview</span>
        </div>

        <h1 class="ld-h">Stop losing<br>to <em>your own</em> mistakes</h1>
        <p class="ld-sub">Paste your game and get a professional review with Stockfish.<br>Discover every blunder, missed opportunity and brilliant move.</p>

        <textarea id="land-pgn" rows="5" placeholder="Paste your PGN here..." 
            style="width:100%; background:#1f1f2a; border:2px solid rgba(99,102,241,0.3); border-radius:16px; padding:18px; color:#ddd; font-family:'Inconsolata', monospace; resize:vertical; min-height:130px;"></textarea>

        <button onclick="launchWithPGN()" class="ld-btn-main" style="width:100%; margin-top:20px; padding:18px; font-size:17px;">
            Analyze My Game — Free
        </button>

        <button onclick="loadSampleAndLaunch('immortal')" 
            style="width:100%; margin-top:12px; padding:16px; background:transparent; border:2px solid rgba(255,255,255,0.15); color:#bbb; border-radius:14px; font-weight:500;">
            Try Demo Game
        </button>
    </div>
</div>

<!-- HEADER -->
<div class="hdr">
    <div class="logo">
        ◈ <span style="color:var(--accent)">ChessReview</span>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn active" id="mode-analyze" onclick="setMode('analyze')">Analysis</button>
        <button class="mode-btn" id="mode-play" onclick="setMode('play')">Play vs Engine</button>
    </div>

    <div style="flex:1"></div>

    <button onclick="doFlip()" style="background:transparent; border:1px solid rgba(255,255,255,0.15); color:var(--text2); padding:8px 18px; border-radius:12px;">Flip Board</button>
    <button onclick="openCustomize()" style="background:transparent; border:1px solid rgba(255,255,255,0.15); color:var(--text2); padding:8px 18px; border-radius:12px;">Customize</button>
    <button onclick="doAnalyze()" style="background:var(--accent); color:white; border:none; padding:10px 26px; border-radius:12px; font-weight:600;">Analyze PGN</button>
</div>

<div class="page" style="display:flex; height:calc(100vh - 68px);">
    <!-- Sidebar, Board y Right Panel irán aquí en siguientes fases -->
    <div style="flex:1; display:flex; align-items:center; justify-content:center; color:var(--text3);">
        <div style="text-align:center;">
            <h2>Board Area</h2>
            <p>Tablero + funcionalidades principales se añadirán en la próxima fase.</p>
        </div>
    </div>
</div>

<script>
// Variables globales
let mode = 'analyze';

// Funciones básicas
function setMode(m) {
    mode = m;
    document.getElementById('mode-analyze').classList.toggle('active', m === 'analyze');
    document.getElementById('mode-play').classList.toggle('active', m === 'play');
}

function launchWithPGN() {
    const pgn = document.getElementById('land-pgn').value.trim();
    if (!pgn) {
        alert("Por favor pega una partida en formato PGN");
        return;
    }
    document.getElementById('landing').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('landing').style.display = 'none';
        alert("¡Análisis iniciado! (Próxima fase incluirá el análisis completo con Stockfish)");
    }, 600);
}

function loadSampleAndLaunch(key) {
    document.getElementById('landing').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('landing').style.display = 'none';
        alert(`Cargando partida de ejemplo: ${key}`);
    }, 500);
}

function doFlip() {
    alert("Tablero volteado (funcionalidad completa en la siguiente fase)");
}

function doAnalyze() {
    alert("Iniciando análisis con Stockfish...");
}

function openCustomize() {
    alert("Personalización del tablero (en desarrollo)");
}

// Inicialización
console.log("%cChessReview v1.1 - Versión Mejorada cargada correctamente", "color:#6366f1; font-weight:bold;");
</script>

</body>
</html>
