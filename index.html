<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessReview — Stop Repeating Blunders</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root {
    --bg0: #0a0a12;
    --bg1: #12121e;
    --bg2: #1c1c2b;
    --bg3: #27273a;
    --accent: #6366f1;
    --accent2: #4f46e5;
    --text: #f1f1fb;
    --text2: #b8b8dd;
    --text3: #7777aa;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: var(--bg0);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */
.hdr {
    height: 70px;
    background: var(--bg1);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 18px;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
}

.logo em { color: var(--accent); }

/* LANDING */
#landing {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 20%, rgba(99,102,241,0.18), transparent 65%), var(--bg0);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.ld-card {
    background: rgba(18,18,32,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 28px;
    padding: 60px 50px;
    max-width: 640px;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,0.7);
}

/* BOARD AREA */
.center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 20px;
    background: var(--bg0);
}

.board-container {
    position: relative;
}

.board-grid {
    display: grid;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(0,0,0,0.85),
                0 0 0 1px rgba(255,255,255,0.15) inset;
    transition: all 0.3s ease;
}

.sq {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: all 0.2s ease;
}

.piece {
    width: 88%;
    height: 88%;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    transition: transform 0.2s ease;
}

.sq:hover .piece {
    transform: scale(1.08);
}

/* Legal Moves */
.legal-move::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    background: rgba(80, 200, 120, 0.5);
    border-radius: 50%;
    z-index: 5;
}

.legal-capture {
    position: absolute;
    inset: 6px;
    border: 4px solid rgba(255, 80, 80, 0.7);
    border-radius: 50%;
    z-index: 5;
}

/* Eval Bar */
.ev-bar-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.ev-num {
    font-family: 'Inconsolata', monospace;
    font-size: 17px;
    font-weight: 600;
    color: var(--text2);
}

.ev-bar {
    width: 20px;
    height: 580px;
    background: #1f1f2e;
    border-radius: 9999px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
}

.ev-fill {
    width: 100%;
    height: 50%;
    background: linear-gradient(to top, #a5b4fc, #6366f1);
    transition: height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Buttons */
button {
    cursor: pointer;
    transition: all 0.2s;
}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
    <div class="ld-card">
        <div class="logo" style="justify-content:center;font-size:34px;margin-bottom:28px;">
            ◈ <span style="background:linear-gradient(90deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">ChessReview</span>
        </div>
        <h1 style="font-size:52px;font-weight:800;line-height:1.1;letter-spacing:-2.5px;margin-bottom:20px;">
            Stop losing to<br><em>your own mistakes</em>
        </h1>
        <p style="font-size:19px;color:var(--text2);margin-bottom:40px;">
            Professional chess analysis with beautiful board and smart insights.
        </p>
        <button onclick="launchWithPGN()" style="width:100%;padding:18px;font-size:18px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;border:none;border-radius:16px;font-weight:700;">
            Analyze My Game
        </button>
    </div>
</div>

<!-- HEADER -->
<div class="hdr">
    <div class="logo">
        ◈ <span style="color:var(--accent)">ChessReview</span>
    </div>
    <div style="flex:1"></div>
    <button onclick="doFlip()" style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:var(--text2);padding:10px 20px;border-radius:12px;">Flip Board</button>
    <button onclick="showCustomize()" style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:var(--text2);padding:10px 20px;border-radius:12px;">Customize</button>
</div>

<div style="display:flex;height:calc(100vh - 70px);">
    <!-- CENTER -->
    <div class="center">
        <div class="ev-bar-container">
            <div id="ev-num">+0.00</div>
            <div class="ev-bar">
                <div class="ev-fill" id="ev-fill"></div>
            </div>
        </div>

        <div class="board-container">
            <div class="board-grid" id="board-grid"></div>
        </div>
    </div>
</div>

<!-- CUSTOMIZE MODAL -->
<div id="customize-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:2000;align-items:center;justify-content:center;">
    <div style="background:var(--bg2);padding:30px;border-radius:20px;width:520px;max-height:90vh;overflow-y:auto;">
        <h3 style="margin-bottom:20px;">Customize Board</h3>
        
        <div style="margin-bottom:20px;">
            <strong>Board Theme</strong>
            <div id="theme-options" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;"></div>
        </div>

        <div>
            <strong>Piece Set</strong>
            <div id="piece-options" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;"></div>
        </div>

        <button onclick="closeCustomize()" style="margin-top:25px;width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:12px;">Close</button>
    </div>
</div>

<script>
// ==================== CONFIG ====================
let chess = new Chess();
let flipped = false;
let currentTheme = 'classic';
let currentPieceSet = 'unicode';

// Board Themes
const BOARD_THEMES = {
    classic:  { light: '#f0d9b5', dark: '#b58863', name: 'Classic' },
    walnut:   { light: '#e8d0a8', dark: '#8b5e3c', name: 'Walnut' },
    marine:   { light: '#d4e8f0', dark: '#4a90b8', name: 'Marine' },
    forest:   { light: '#e8f0d0', dark: '#5a8a42', name: 'Forest' },
    midnight: { light: '#a0a0cc', dark: '#2a2a4a', name: 'Midnight' },
    emerald:  { light: '#eeeed2', dark: '#769656', name: 'Emerald' }
};

// Piece rendering
function getPieceHTML(color, type) {
    const unicodePieces = {
        'w': { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
        'b': { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
    };
    
    if (currentPieceSet === 'unicode') {
        return `<span style="font-size:52px;">${unicodePieces[color][type]}</span>`;
    }
    
    // Default to unicode for now (we can add SVG sets later)
    return `<span style="font-size:52px;">${unicodePieces[color][type]}</span>`;
}

// Render Board
function renderBoard() {
    const grid = document.getElementById('board-grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(8, 72px)';
    grid.style.gridTemplateRows = 'repeat(8, 72px)';

    const boardArray = chess.board();
    const ranks = flipped ? Array.from({length:8}, (_,i)=>i) : Array.from({length:8}, (_,i)=>7-i);
    const files = flipped ? Array.from({length:8}, (_,i)=>7-i) : Array.from({length:8}, (_,i)=>i);

    for (let r of ranks) {
        for (let c of files) {
            const squareName = String.fromCharCode(97 + c) + (r + 1);
            const isLight = (r + c) % 2 === 0;
            const theme = BOARD_THEMES[currentTheme];

            const sq = document.createElement('div');
            sq.className = `sq ${isLight ? 'li' : 'dk'}`;
            sq.style.background = isLight ? theme.light : theme.dark;
            sq.dataset.square = squareName;

            const piece = boardArray[7-r][c];
            if (piece) {
                const pieceDiv = document.createElement('div');
                pieceDiv.className = 'piece';
                pieceDiv.innerHTML = getPieceHTML(piece.color, piece.type);
                sq.appendChild(pieceDiv);
            }

            sq.addEventListener('click', () => handleSquareClick(squareName));
            grid.appendChild(sq);
        }
    }
}

// Click handler
function handleSquareClick(square) {
    // Basic move logic (will be expanded in next phases)
    console.log("Clicked:", square);
    // For now just log - full move logic in next phase
}

// Flip
function doFlip() {
    flipped = !flipped;
    renderBoard();
}

// Customize Modal
function showCustomize() {
    const modal = document.getElementById('customize-modal');
    modal.style.display = 'flex';
    
    // Render themes
    const themeDiv = document.getElementById('theme-options');
    themeDiv.innerHTML = '';
    Object.keys(BOARD_THEMES).forEach(key => {
        const th = BOARD_THEMES[key];
        const btn = document.createElement('div');
        btn.style.cssText = `background:${th.dark};height:60px;border-radius:8px;cursor:pointer;border:3px solid ${currentTheme===key?'#6366f1':'transparent'};`;
        btn.onclick = () => {
            currentTheme = key;
            renderBoard();
            showCustomize(); // refresh modal
        };
        themeDiv.appendChild(btn);
    });
}

function closeCustomize() {
    document.getElementById('customize-modal').style.display = 'none';
}

// Launch
function launchWithPGN() {
    document.getElementById('landing').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('landing').style.display = 'none';
        renderBoard();
    }, 600);
}

// Init
window.onload = () => {
    renderBoard();
    console.log("%cChessReview - Fase 3 cargada con tablero atractivo", "color:#6366f1;font-weight:bold");
};
</script>
</body>
</html>
