<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessReview — Stop Repeating Blunders</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root {
  --bg0:#09090f; --bg1:#0f0f17; --bg2:#16161f; --bg3:#1e1e2a; --bg4:#26263a;
  --b:rgba(255,255,255,.06); --b2:rgba(255,255,255,.13);
  --t0:#ededf4; --t1:#b8b8d0; --t2:#7070a0; --t3:#40405a;
  --g:#6366f1; --g2:#4f46e5; --r:#c03030;
  --sq-l:#f0d9b5; --sq-d:#b58863;
  --hi-from:rgba(15,200,60,.5); --hi-to:rgba(15,200,60,.75);
  --hi-sel:rgba(120,120,255,.5);
  --fu:'Sora',sans-serif; --fm:'Inconsolata',monospace;
  --sq: 68px; --rs: 6px;
}

/* Global Styles */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--t0);font-family:var(--fu);}
button{font-family:var(--fu);cursor:pointer;border:none;}

/* Header & Navigation */
.hdr{height:52px;background:var(--bg1);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 18px;gap:12px;z-index:50;}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;}
.logo em{color:var(--g);font-style:normal;}

/* Board UI */
.page{display:flex;height:calc(100vh - 52px);}
.sidebar{width:260px;background:var(--bg1);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow-y:auto;}
.center{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg0);}
.board-grid{display:grid;grid-template-columns:repeat(8, var(--sq));grid-template-rows:repeat(8, var(--sq));border:4px solid var(--bg3);border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,0.5);}

.sq{width:var(--sq);height:var(--sq);display:flex;align-items:center;justify-content:center;position:relative;}
.sq.li{background-color:var(--sq-l);}
.sq.dk{background-color:var(--sq-d);}
.piece{width:90%;height:90%;cursor:grab;}
.piece:active{cursor:grabbing;}

/* Analysis Stats */
.rpanel{width:280px;background:var(--bg1);border-left:1px solid var(--b);padding:15px;overflow-y:auto;}
.acc-c{background:var(--bg2);padding:15px;border-radius:8px;margin-bottom:10px;border:1px solid var(--b);}
.acc-n{font-family:var(--fm);font-size:24px;font-weight:700;color:var(--g);}

/* Landing Overlay */
#landing{position:fixed;inset:0;background:var(--bg0);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.ld-card{max-width:500px;padding:20px;}
.ld-h{font-size:48px;font-weight:800;margin-bottom:20px;}
.ld-pgn{width:100%;height:120px;background:var(--bg2);color:var(--t1);border:1px solid var(--g);border-radius:8px;padding:12px;font-family:var(--fm);margin-bottom:20px;}
.ld-btn-main{background:var(--g);color:white;padding:15px 30px;border-radius:8px;font-weight:700;font-size:18px;transition:0.2s;}
.ld-btn-main:hover{background:var(--g2);transform:translateY(-2px);}

/* Responsive */
@media (max-width: 1000px) {
  :root { --sq: 45px; }
  .sidebar, .rpanel { display: none; }
}
</style>
</head>
<body>

<div id="landing">
  <div class="ld-card">
    <h1 class="ld-h">Chess<em>Review</em></h1>
    <p style="color:var(--t2); margin-bottom:20px;">Analiza tus partidas con el poder de Stockfish 10.</p>
    <textarea id="land-pgn" class="ld-pgn" placeholder="Pega tu PGN aquí..."></textarea>
    <button class="ld-btn-main" onclick="launchAnalysis()">Analizar Partida</button>
  </div>
</div>

<div class="hdr">
  <div class="logo">◈ <span><em>Chess</em>Review</span></div>
  <div style="flex:1"></div>
  <button style="background:var(--bg3); color:var(--t1); padding:6px 12px; border-radius:4px;" onclick="location.reload()">Nuevo</button>
</div>

<div class="page">
  <div class="sidebar">
    <div style="padding:15px;">
      <h3 style="font-size:12px; color:var(--t3); text-transform:uppercase; margin-bottom:10px;">Movimientos</h3>
      <div id="mv-list" style="font-family:var(--fm); font-size:14px; line-height:2;"></div>
    </div>
  </div>

  <div class="center">
    <div id="board-grid" class="board-grid"></div>
  </div>

  <div class="rpanel">
    <div class="acc-c">
      <div style="font-size:10px; color:var(--t3);">PRECISIÓN BLANCAS</div>
      <div id="acc-w" class="acc-n">--%</div>
    </div>
    <div class="acc-c">
      <div style="font-size:10px; color:var(--t3);">PRECISIÓN NEGRAS</div>
      <div id="acc-b" class="acc-n">--%</div>
    </div>
    <div id="eval-box" style="margin-top:20px; font-family:var(--fm); background:var(--bg2); padding:10px; border-radius:4px;">
      Eval: <span id="ev-val">0.0</span>
    </div>
  </div>
</div>

<script>
const chess = new Chess();
const boardEl = document.getElementById('board-grid');
let selectedSq = null;

// Piezas SVG (Simplificadas para el ejemplo)
const PIECES = {
  wp: '♙', wr: '♖', wn: '♘', wb: '♗', wq: '♕', wk: '♔',
  bp: '♟', br: '♜', bn: '♞', bb: '♝', bq: '♛', bk: '♚'
};

function initBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sqId = String.fromCharCode(97 + c) + (8 - r);
      const div = document.createElement('div');
      div.className = `sq ${(r + c) % 2 === 0 ? 'li' : 'dk'}`;
      div.id = sqId;
      div.onclick = () => handleSqClick(sqId);
      boardEl.appendChild(div);
    }
  }
  updatePieces();
}

function updatePieces() {
  const board = chess.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sqId = String.fromCharCode(97 + c) + (8 - r);
      const sq = document.getElementById(sqId);
      const piece = board[r][c];
      sq.innerHTML = piece ? `<span class="piece" style="font-size: calc(var(--sq) * 0.7); color: ${piece.color === 'w' ? 'white' : 'black'}">${PIECES[piece.color + piece.type]}</span>` : '';
    }
  }
}

function handleSqClick(sqId) {
  if (selectedSq === sqId) {
    selectedSq = null;
    updateBoardHighilights();
    return;
  }

  const move = chess.move({ from: selectedSq, to: sqId, promotion: 'q' });
  if (move) {
    selectedSq = null;
    updatePieces();
    updateMoveList();
  } else {
    selectedSq = sqId;
  }
  updateBoardHighilights();
}

function updateBoardHighilights() {
  document.querySelectorAll('.sq').forEach(s => s.style.boxShadow = 'none');
  if (selectedSq) {
    document.getElementById(selectedSq).style.boxShadow = 'inset 0 0 10px rgba(99,102,241,0.8)';
  }
}

function updateMoveList() {
  const history = chess.history();
  const list = document.getElementById('mv-list');
  list.innerHTML = history.map((m, i) => 
    i % 2 === 0 ? `<span>${(i/2)+1}. <b>${m}</b></span>` : `<span> <b>${m}</b></span>`
  ).join(' ');
}

function launchAnalysis() {
  const pgn = document.getElementById('land-pgn').value;
  if (pgn) {
    chess.load_pgn(pgn);
    updatePieces();
    updateMoveList();
  }
  document.getElementById('landing').style.display = 'none';
}

// Inicializar
initBoard();
</script>

</body>
</html>
