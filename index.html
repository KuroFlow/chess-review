<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessReview — Análisis Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root {
  --bg0: #0a0a0f;
  --bg1: #12121a;
  --bg2: #1a1a24;
  --bg3: #22222e;
  --accent: #6366f1;
  --accent2: #4f46e5;
  --text: #f0f0f8;
  --text2: #c0c0d8;
  --text3: #8888aa;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #eab308;
  
  --sq-l: #f0d9b5;
  --sq-d: #b58863;
}

* { box-sizing: border-box; margin:0; padding:0; }
body {
  background: var(--bg0);
  color: var(--text);
  font-family: 'Sora', sans-serif;
  height: 100vh;
  overflow: hidden;
}

.hdr {
  height: 64px;
  background: var(--bg1);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 20px;
}

.logo em { color: var(--accent); }

.mode-toggle {
  display: flex;
  background: var(--bg2);
  border-radius: 9999px;
  padding: 4px;
}

.mode-btn {
  padding: 8px 20px;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
}

.mode-btn.active {
  background: var(--accent);
  color: white;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}

/* Landing Mejorada */
#landing {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(99,102,241,0.15), transparent 70%),
              var(--bg0);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.ld-card {
  background: rgba(18,18,36,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 24px;
  padding: 48px 40px;
  max-width: 620px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
}

.ld-h {
  font-size: 52px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -2.5px;
  margin-bottom: 16px;
}

.ld-h em {
  background: linear-gradient(90deg, #6366f1, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Tablero más premium */
.board-grid {
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6),
              inset 0 0 0 1px rgba(255,255,255,0.08);
}

/* Eval Bar Mejorada */
.ev-bar {
  width: 18px;
  background: #1f1f2e;
  border-radius: 9999px;
  overflow: hidden;
  position: relative;
}

.ev-white {
  transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Más cambios visuales importantes */
.sbtn-main {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-weight: 600;
  font-size: 15px;
  transition: all 0.2s;
}

.sbtn-main:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(99,102,241,0.3);
}

/* ... (el resto del CSS se mantiene similar pero con mejoras) ... */
</style>
</head>
<body>

<!-- LANDING MEJORADA -->
<div id="landing">
  <div class="ld-card">
    <div class="logo" style="justify-content:center; font-size:28px; margin-bottom:24px;">
      ◈ <span style="background:linear-gradient(90deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">ChessReview</span>
    </div>
    
    <h1 class="ld-h">Deja de perder<br>por <em>tus propios errores</em></h1>
    <p style="font-size:18px; color:var(--text2); margin-bottom:32px;">
      Análisis profundo con Stockfish • Detección inteligente de blunders • 
      Review resumido con Key Moments
    </p>

    <textarea id="land-pgn" placeholder="Pega tu PGN aquí..." 
      style="width:100%; height:120px; background:#1a1a24; border:2px solid #6366f133; border-radius:16px; padding:16px; color:#ddd; font-family:monospace; margin-bottom:20px;"></textarea>

    <div style="display:flex; gap:12px;">
      <button onclick="launchWithPGN()" 
        style="flex:1; padding:18px; font-size:17px; font-weight:700; background:linear-gradient(135deg,#6366f1,#7c3aed); border:none; border-radius:16px; color:white;">
        Analizar mi partida
      </button>
      <button onclick="loadSampleAndLaunch('immortal')" 
        style="padding:18px 32px; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.15); border-radius:16px; color:#ccc;">
        Ver Demo
      </button>
    </div>
  </div>
</div>

<!-- El resto del HTML (header, sidebar, board, etc.) se mantiene similar 
     pero con mejoras de clases y estilos -->

</body>
</html>
