<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessReview — Stop Repeating Blunders</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root {
    --bg0: #09090f;
    --bg1: #111118;
    --bg2: #1a1a24;
    --bg3: #242430;
    --accent: #6366f1;
    --accent-dark: #4f46e5;
    --text: #f0f0fa;
    --text2: #b8b8d8;
    --text3: #7a7aa0;

    --sq-l: #f0d9b5;
    --sq-d: #b58863;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: var(--bg0);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* HEADER */
.hdr {
    height: 68px;
    background: var(--bg1);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 23px;
    font-weight: 700;
}

.logo em { color: var(--accent); font-style: normal; }

.mode-toggle {
    display: flex;
    background: var(--bg2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9999px;
    padding: 4px;
}

.mode-btn {
    padding: 9px 22px;
    border-radius: 9999px;
    font-size: 14.5px;
    font-weight: 600;
    transition: all 0.25s;
}

.mode-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
}

/* LANDING */
#landing {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 25%, rgba(99,102,241,0.16), transparent 70%), var(--bg0);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.6s ease;
}

.ld-card {
    background: rgba(17,17,27,0.96);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 28px;
    padding: 56px 48px;
    max-width: 620px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.65);
}

.ld-h {
    font-size: 54px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -2.8px;
    margin-bottom: 20px;
}

.ld-h em {
    background: linear-gradient(90deg, #6366f1, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* BOARD */
.center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg0);
}

.board-inner {
    position: relative;
}

.board-grid {
    display: grid;
    grid-template-columns: repeat(8, 70px);
    grid-template-rows: repeat(8, 70px);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.8),
                inset 0 0 0 1px rgba(255,255,255,0.12);
}

.sq {
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: filter 0.1s;
}

.sq.li { background: var(--sq-l); }
.sq.dk { background: var(--sq-d); }

.sq:hover { filter: brightness(1.12); }

.piece {
    width: 86%;
    height: 86%;
    z-index: 3;
    pointer-events: none;
}

/* Legal moves */
.sq .legal-dot {
    position: absolute;
    width: 18px;
    height: 18px;
    background: rgba(0, 255, 80, 0.45);
    border-radius: 50%;
    z-index: 4;
}

.sq .legal-capture {
    position: absolute;
    inset: 0;
    border: 5px solid rgba(255, 60, 60, 0.6);
    border-radius: 50%;
    z-index: 4;
    box-sizing: border-box;
}

/* Eval Bar */
.ev-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-right: 12px;
}

.ev-bar {
    width: 18px;
    height: 560px;
    background: #1f1f2a;
    border-radius: 9999px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
}

.ev-white {
    height: 50%;
    background: linear-gradient(to top, #a5b4fc, #6366f1);
    transition: height 0.4s ease;
}

/* Buttons */
button {
    cursor: pointer;
}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
    <div class="ld-card">
        <div class="logo" style="justify-content:center; font-size:32px; margin-bottom:32px;">
            ◈ <span style="background:linear-gradient(90deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">ChessReview</span>
        </div>
        <h1 class="ld-h">Stop losing<br>to <em>your own</em> mistakes</h1>
        <p style="font-size:18px; color:var(--text2); margin-bottom:40px;">Paste a game. Get a professional review with Stockfish.</p>

        <textarea id="land-pgn" rows="4" placeholder="Paste your PGN here..." 
            style="width:100%; background:#1f1f2a; border:2px solid rgba(99,102,241,0.3); border-radius:16px; padding:18px; color:#ddd; font-family:monospace; resize:vertical;"></textarea>

        <button onclick="launchWithPGN()" style="width:100%; margin-top:20px; padding:18px; font-size:17px; background:linear-gradient(135deg,#6366f1,#4f46e5); color:white; border:none; border-radius:16px; font-weight:700;">
            Analyze My Game — Free
        </button>
    </div>
</div>

<!-- HEADER -->
<div class="hdr">
    <div class="logo">
        ◈ <span style="color:var(--accent)">ChessReview</span>
    </div>
    <div class="mode-toggle">
        <button class="mode-btn active" id="mode-analyze" onclick="setMode('analyze')">Analysis</button>
        <button class="mode-btn" id="mode-play" onclick="setMode('play')">Play</button>
    </div>
    <div style="flex:1"></div>
    <button onclick="doFlip()" style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:var(--text2);padding:8px 18px;border-radius:12px;">Flip</button>
    <button onclick="doAnalyze()" style="background:var(--accent);color:white;border:none;padding:10px 24px;border-radius:12px;font-weight:600;">Analyze</button>
</div>

<div class="page" style="display:flex;height:calc(100vh - 68px);">
    <!-- CENTER BOARD -->
    <div class="center">
        <div class="ev-col">
            <div id="ev-num" style="font-family:monospace; font-size:15px; color:var(--text2);">+0.00</div>
            <div class="ev-bar"><div class="ev-white" id="ev-white"></div></div>
        </div>
        
        <div class="board-inner">
            <div class="board-grid" id="board-grid"></div>
        </div>
    </div>
</div>

<script>
// ==================== GLOBAL VARIABLES ====================
let chess = new Chess();
let flipped = false;
let currentTheme = 'classic';
let selectedSq = null;
let legalMoves = [];

// Board themes
const THEMES = {
    classic: { light: '#f0d9b5', dark: '#b58863' },
    walnut:  { light: '#e8c99a', dark: '#8b5e3c' },
    marine:  { light: '#d4e8f0', dark: '#4a90b8' }
};

// ==================== RENDER BOARD ====================
function renderBoard() {
    const grid = document.getElementById('board-grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(8, 70px)';
    grid.style.gridTemplateRows = 'repeat(8, 70px)';

    const board = chess.board();
    const ranks = flipped ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
    const files = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

    for (let r of ranks) {
        for (let c of files) {
            const sqName = String.fromCharCode(97 + c) + (r + 1);
            const isLight = (r + c) % 2 === 0;
            const theme = THEMES[currentTheme];

            const sq = document.createElement('div');
            sq.className = `sq ${isLight ? 'li' : 'dk'}`;
            sq.dataset.square = sqName;
            sq.style.background = isLight ? theme.light : theme.dark;

            // Piece
            const piece = board[7-r][c];
            if (piece) {
                const pDiv = document.createElement('div');
                pDiv.className = 'piece';
                pDiv.innerHTML = getPieceUnicode(piece.color, piece.type);
                sq.appendChild(pDiv);
            }

            // Legal move indicator
            if (legalMoves.includes(sqName)) {
                const dot = document.createElement('div');
                dot.className = piece ? 'legal-capture' : 'legal-dot';
                sq.appendChild(dot);
            }

            sq.addEventListener('click', () => handleSquareClick(sqName));
            grid.appendChild(sq);
        }
    }
}

// Simple Unicode pieces
function getPieceUnicode(color, type) {
    const pieces = {
        'w': { 'p':'♙','r':'♖','n':'♘','b':'♗','q':'♕','k':'♔' },
        'b': { 'p':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚' }
    };
    return pieces[color][type] || '';
}

// ==================== SQUARE CLICK LOGIC ====================
function handleSquareClick(square) {
    const piece = chess.get(square);

    if (selectedSq) {
        // Try to make move
        const move = chess.move({ from: selectedSq, to: square, promotion: 'q' });
        if (move) {
            renderBoard();
            selectedSq = null;
            legalMoves = [];
            return;
        } 
        // If not valid move, deselect
        selectedSq = null;
        legalMoves = [];
        renderBoard();
    }

    // Select piece
    if (piece && piece.color === chess.turn()) {
        selectedSq = square;
        legalMoves = chess.moves({ square: square, verbose: true }).map(m => m.to);
        renderBoard();
    }
}

function doFlip() {
    flipped = !flipped;
    renderBoard();
}

function setMode(m) {
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`mode-${m}`).classList.add('active');
}

function launchWithPGN() {
    const pgn = document.getElementById('land-pgn').value.trim();
    if (pgn) {
        document.getElementById('landing').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('landing').style.display = 'none';
            alert("PGN cargado. Tablero listo.");
            renderBoard();
        }, 600);
    }
}

function doAnalyze() {
    alert("Análisis completo con Stockfish se añadirá en la siguiente fase.");
}

// Initialize
window.onload = () => {
    renderBoard();
    console.log("%cChessReview - Fase 2 cargada (Tablero funcional)", "color:#6366f1; font-weight:bold");
};
</script>

</body>
</html>
